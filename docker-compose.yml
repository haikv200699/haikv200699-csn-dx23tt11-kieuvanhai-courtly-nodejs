services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: courtly
      POSTGRES_PASSWORD: courtly
      POSTGRES_DB: courtly
    ports:
      - "5432:5432"
    volumes:
      - courtly_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U courtly -d courtly"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  courtly_data:
